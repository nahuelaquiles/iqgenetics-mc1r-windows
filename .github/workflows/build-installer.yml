name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ "main", "release-2026-haplotype" ]
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build application
        run: dotnet build .\src\IQGenetics.MC1R.App\IQGenetics.MC1R.App.csproj -c Release --no-restore

      - name: Run MC1R haplotype self-test
        run: dotnet run --project .\tests\IQGenetics.MC1R.SelfTest\IQGenetics.MC1R.SelfTest.csproj -c Release

      - name: Publish self-contained app (win-x64)
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\publish | Out-Null
          dotnet publish .\src\IQGenetics.MC1R.App\IQGenetics.MC1R.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:PublishTrimmed=false `
            -o .\artifacts\publish

      - name: Verify bundled reference
        run: |
          if (!(Test-Path .\artifacts\publish\MC1R_reference.fna)) { throw "Bundled MC1R_reference.fna missing from publish output." }
          Get-Item .\artifacts\publish\MC1R_reference.fna | Select-Object FullName, Length

      - name: Build MSI (WiX v4)
        run: |
          $publishPath = (Resolve-Path .\artifacts\publish).Path -replace '\\', '/'
          if (-not $publishPath.EndsWith('/')) { $publishPath = $publishPath + '/' }
          Write-Host "PublishDir passed to WiX: $publishPath"
          dotnet build .\build\installer\IQGenetics.MC1R.Installer.wixproj `
            -c Release `
            /p:PublishDir=$publishPath `
            /p:InstallerPlatform=x64

      - name: Collect MSI
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installer | Out-Null
          $msis = Get-ChildItem -Recurse -Path . -Filter *.msi | Where-Object { $_.FullName -notlike '*artifacts\installer*' }
          if ($msis.Count -eq 0) { throw "No MSI produced anywhere in the workspace." }
          $m = $msis | Select-Object -First 1
          Copy-Item $m.FullName .\artifacts\installer\IQGenetics_MC1R_Haplotype_v1.0.msi -Force
          Get-ChildItem .\artifacts\installer -Filter *.msi | Select-Object FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: IQGenetics_MC1R_Haplotype_v1.0
          path: artifacts/installer/IQGenetics_MC1R_Haplotype_v1.0.msi
          if-no-files-found: error
